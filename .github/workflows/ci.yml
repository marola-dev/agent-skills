name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run ruff check . && pipx run ruff format --check .
      - run: python3 scripts/refresh.py --self-test
      - run: |
          for f in data/*.json; do python3 -m json.tool "$f" > /dev/null; done
